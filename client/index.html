<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entscheidungen</title>
  <!-- trek:ui -->
  <style>
    :root { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    body { margin: 0; }
    /* A trip tab is a filling surface: the host locks the frame to its container and the
       kit pins <body>, so the app scrolls itself. Without fill (dev preview) the document
       grows and reports its height instead. */
    [data-fill] #app { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    svg.i { width: 1em; height: 1em; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.125em; }
    button { font: inherit; }
    .wrap { max-width: 1320px; margin: 0 auto; padding: 18px 20px 48px; }
    [data-form-factor="phone"] .wrap { padding: 12px 14px 40px; }
    h1 { font-size: 22px; line-height: 1.25; margin: 0; font-weight: 700; letter-spacing: -0.01em; color: var(--m-ink, var(--text-primary)); }
    h2 { font-size: 13px; margin: 0; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--m-muted, var(--text-muted)); }
    h3 { font-size: 16px; margin: 0; font-weight: 650; line-height: 1.3; color: var(--m-ink, var(--text-primary)); overflow-wrap: anywhere; }
    .row { display: flex; align-items: center; gap: 8px; }
    .grow { flex: 1 1 auto; min-width: 0; }
    .wrapx { flex-wrap: wrap; }
    .muted { color: var(--m-muted, var(--text-muted)); }
    .faint { color: var(--m-faint, var(--text-faint)); }
    .small { font-size: 12px; }
    .num { font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }
    .btn-sm { padding: 4px 10px !important; font-size: 12px !important; }
    .trek-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .trek-btn:disabled { opacity: .45; cursor: not-allowed; }
    .iconbtn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 999px; border: 1px solid var(--m-gbr, var(--border-primary)); background: var(--m-ic, var(--bg-tertiary, transparent)); color: var(--m-ink, var(--text-primary)); cursor: pointer; flex: none; font-size: 16px; padding: 0; }
    .iconbtn:hover { background: var(--bg-hover); }
    .iconbtn:active { transform: scale(.94); }
    .iconbtn.danger { color: var(--danger); }
    .iconbtn:disabled { opacity: .4; cursor: not-allowed; }
    [data-form-factor="phone"] .iconbtn { width: 44px; height: 44px; }

    /* Header ---------------------------------------------------------------- */
    .pagehead { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .pagehead .grow { min-width: 200px; }
    .sub { margin-top: 3px; font-size: 13px; color: var(--m-muted, var(--text-muted)); }

    /* Category marks ---------------------------------------------------------- */
    .cat { --hue: #64748b; }
    .cat-unterkunft { --hue: #8b5cf6; } .cat-flug { --hue: #0ea5e9; } .cat-zug { --hue: #10b981; }
    .cat-mietwagen { --hue: #f59e0b; } .cat-aktivitaet { --hue: #ec4899; } .cat-sonstiges { --hue: #64748b; }
    .catic { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; flex: none; font-size: 19px;
      color: var(--hue); background: color-mix(in srgb, var(--hue) 14%, transparent); }
    .catlabel { display: inline-flex; align-items: center; gap: 6px; color: var(--hue); font-weight: 700; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; }

    /* Overview -------------------------------------------------------------- */
    .section { margin-top: 22px; }
    .section > .sechead { display: flex; align-items: center; gap: 8px; margin: 0 2px 10px; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; }
    .dlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; }
    [data-form-factor="phone"] .dlist { grid-template-columns: 1fr; }
    .drow { display: flex; align-items: center; gap: 12px; padding: 14px; text-align: left; width: 100%; cursor: pointer; color: inherit; font: inherit; min-height: 72px; }
    .drow .title { font-weight: 650; font-size: 15px; color: var(--m-ink, var(--text-primary)); overflow-wrap: anywhere; }
    .drow .meta { font-size: 12.5px; color: var(--m-muted, var(--text-muted)); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
    .drow .meta .lead { display: inline-flex; gap: 4px; align-items: center; color: var(--m-ink, var(--text-secondary)); }
    .drow .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
    .empty { text-align: center; padding: 56px 20px; }
    .empty .big { font-size: 40px; color: var(--m-faint, var(--text-faint)); }
    .empty p { max-width: 440px; margin: 10px auto 18px; color: var(--m-muted, var(--text-muted)); }

    /* Detail ---------------------------------------------------------------- */
    .topbar { display: flex; align-items: center; gap: 10px; }
    .topbar .tools { display: flex; gap: 6px; flex: none; margin-left: auto; }
    .dtitle { margin-top: 8px; }
    .kebab { position: relative; flex: none; margin: -6px -8px 0 0; }
    .kebab > .iconbtn { width: 32px; height: 32px; border-color: transparent; background: transparent; color: var(--m-muted, var(--text-muted)); }
    .kebab > .iconbtn:hover, .kebab > .iconbtn[aria-expanded="true"] { background: var(--bg-hover); color: var(--m-ink, var(--text-primary)); }
    [data-form-factor="phone"] .kebab > .iconbtn { width: 44px; height: 44px; }
    .menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; min-width: 180px; padding: 6px; border-radius: 12px;
      background: var(--m-card, var(--bg-card)); border: 1px solid var(--m-cbr, var(--border-primary)); box-shadow: var(--shadow-lg, 0 12px 32px rgba(0,0,0,.18)); }
    .menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; background: none; border-radius: 8px;
      cursor: pointer; text-align: left; font-size: 13.5px; color: var(--m-ink, var(--text-primary)); }
    .menu button:hover { background: var(--bg-hover); }
    .menu button.danger { color: var(--danger); }
    [data-form-factor="phone"] .menu button { padding: 12px; font-size: 15px; }
    .meta-line { margin-top: 8px; font-size: 12.5px; color: var(--m-faint, var(--text-faint)); display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; }
    .meta-line > span { display: inline-flex; align-items: center; gap: 5px; }
    .pollbar { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin-top: 12px; padding: 8px 10px 8px 12px; border-radius: 12px;
      border: 1px dashed var(--m-cbr, var(--border-primary)); font-size: 13px; color: var(--m-muted, var(--text-secondary)); }
    .pollbar .ic { color: var(--accent); font-size: 16px; display: inline-flex; }
    .pcempty { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--m-faint, var(--text-faint)); }
    .linkbtn { border: 0; background: none; padding: 4px 0; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--m-muted, var(--text-muted)); display: inline-flex; align-items: center; gap: 5px; }
    .linkbtn:hover { color: var(--m-ink, var(--text-primary)); }
    [data-form-factor="phone"] .linkbtn { padding: 10px 0; font-size: 14px; }
    .aibox { padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 6%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent); display: flex; flex-direction: column; gap: 8px; }
    .aibox .linkbtn { color: var(--m-ink, var(--text-primary)); }
    .aibody { display: flex; flex-direction: column; gap: 8px; }
    .aibody .trek-textarea { width: 100%; box-sizing: border-box; }
    .conv { font-size: 12px; color: var(--m-faint, var(--text-faint)); font-variant-numeric: tabular-nums; }
    .split { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px 42px; }
    .split button { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; cursor: pointer; font-size: 12.5px;
      border: 1px solid var(--m-gbr, var(--border-primary)); background: transparent; color: var(--m-muted, var(--text-muted)); }
    .split button .av { margin-left: 0; border: 0; width: 20px; height: 20px; }
    .split button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 12%, transparent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--m-ink, var(--text-primary)); }
    .split button[aria-pressed="false"] .av { opacity: .35; }
    [data-form-factor="phone"] .split { margin-left: 0; }
    [data-form-factor="phone"] .split button { padding: 6px 12px 6px 6px; font-size: 14px; }
    .desc { margin: 10px 0 0; white-space: pre-wrap; color: var(--m-muted, var(--text-secondary)); max-width: 860px; overflow-wrap: anywhere; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border-radius: 14px; margin-top: 14px; border: 1px solid; }
    .banner .ic { font-size: 20px; flex: none; }
    .banner.ok { border-color: color-mix(in srgb, var(--success) 35%, transparent); background: color-mix(in srgb, var(--success) 9%, transparent); }
    .banner.ok .ic { color: var(--success); }
    .banner.warn { border-color: color-mix(in srgb, var(--warning, #d97706) 40%, transparent); background: color-mix(in srgb, var(--warning, #d97706) 10%, transparent); }
    .banner.warn .ic { color: var(--warning, #d97706); }
    .banner.mute { border-color: var(--m-cbr, var(--border-primary)); background: var(--bg-hover); }
    .banner .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
    .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 18px 0 14px; }
    .seg { display: inline-flex; padding: 3px; border-radius: 999px; gap: 2px; background: var(--m-glass, var(--bg-tertiary, var(--bg-hover))); border: 1px solid var(--m-gbr, var(--border-primary)); }
    .seg button { border: 0; background: none; cursor: pointer; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 550; color: var(--m-muted, var(--text-muted)); display: inline-flex; align-items: center; gap: 6px; }
    .seg button.on { background: var(--m-card, var(--bg-card)); color: var(--m-ink, var(--text-primary)); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    [data-form-factor="phone"] .seg button { padding: 10px 14px; }
    .divisor { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--m-muted, var(--text-muted)); }
    .divisor .val { min-width: 22px; text-align: center; font-weight: 700; color: var(--m-ink, var(--text-primary)); }
    .divisor .iconbtn { width: 28px; height: 28px; font-size: 13px; }
    [data-form-factor="phone"] .divisor .iconbtn { width: 38px; height: 38px; }
    .check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--m-muted, var(--text-secondary)); user-select: none; }
    .check input { width: 17px; height: 17px; accent-color: var(--accent); margin: 0; }

    /* Option cards ------------------------------------------------------------ */
    .ogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-items: start; }
    [data-form-factor="phone"] .ogrid { grid-template-columns: 1fr; }
    .ocard { padding: 16px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
    .ocard.lead { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent), var(--shadow-card, none); }
    .ocard.winner { box-shadow: 0 0 0 2px color-mix(in srgb, var(--success) 70%, transparent), var(--shadow-card, none); }
    .ocard.vetoed { background: color-mix(in srgb, var(--danger) 4%, var(--m-card, var(--bg-card))); }
    .ochead { display: flex; align-items: flex-start; gap: 10px; }
    .rank { flex: none; min-width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-size: 12px; font-weight: 800;
      background: var(--bg-hover); color: var(--m-muted, var(--text-muted)); font-variant-numeric: tabular-nums; }
    .ocard.lead .rank { background: var(--accent); color: var(--accent-text); }
    .ocard.winner .rank { background: var(--success); color: #fff; }
    .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
    .tags .trek-chip { font-size: 11px; padding: 2px 8px; }
    .price { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .price .big { font-size: 22px; font-weight: 750; letter-spacing: -0.01em; color: var(--m-ink, var(--text-primary)); font-variant-numeric: tabular-nums; }
    .price .pp { font-size: 13px; color: var(--m-muted, var(--text-muted)); font-variant-numeric: tabular-nums; }
    .price .note { width: 100%; font-size: 12px; color: var(--m-faint, var(--text-faint)); margin-top: -4px; }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; padding: 10px 12px; border-radius: 12px; background: var(--bg-hover); }
    .field .k { font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--m-faint, var(--text-faint)); }
    .field .v { font-size: 13px; font-weight: 600; color: var(--m-ink, var(--text-primary)); overflow-wrap: anywhere; }
    .field.wide { grid-column: 1 / -1; }
    .onotes { font-size: 13px; color: var(--m-muted, var(--text-secondary)); white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
    .onotes.open { -webkit-line-clamp: unset; display: block; }
    .pc { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    [data-form-factor="phone"] .pc { grid-template-columns: 1fr; }
    .pc h4 { margin: 0 0 4px; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; display: flex; align-items: center; gap: 5px; }
    .pc .pro h4 { color: var(--success); } .pc .con h4 { color: var(--danger); }
    .pc ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .pc li { display: flex; gap: 6px; align-items: flex-start; font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; }
    .pc li .mark { flex: none; font-weight: 800; width: 12px; text-align: center; }
    .pc .pro .mark { color: var(--success); } .pc .con .mark { color: var(--danger); }
    .pc li .who { flex: none; margin-left: auto; display: inline-flex; align-items: center; gap: 2px; }
    .pc li .x { border: 0; background: none; color: var(--m-faint, var(--text-faint)); cursor: pointer; padding: 0 2px; font-size: 13px; display: inline-grid; place-items: center; }
    .pc li .x:hover { color: var(--danger); }
    .pc .none { font-size: 12px; color: var(--m-faint, var(--text-faint)); }
    .pcadd { display: flex; gap: 6px; align-items: center; }
    .pcadd input { flex: 1 1 auto; min-width: 0; }
    .pcadd .trek-btn { flex: none; padding: 6px 10px; }
    .votes { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--m-rowbr, var(--border-faint)); }
    .vote { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-weight: 650; font-size: 13px;
      border: 1px solid var(--m-gbr, var(--border-primary)); background: transparent; color: var(--m-ink, var(--text-primary)); min-height: 34px; }
    .vote:hover:not(:disabled) { background: var(--bg-hover); }
    .vote:active:not(:disabled) { transform: scale(.96); }
    .vote:disabled { opacity: .5; cursor: not-allowed; }
    .vote.up.on { background: var(--accent); color: var(--accent-text); border-color: transparent; }
    .vote.veto.on { background: var(--danger); color: #fff; border-color: transparent; }
    [data-form-factor="phone"] .vote { min-height: 44px; padding: 8px 14px; }
    .avs { display: inline-flex; align-items: center; padding-left: 6px; }
    .av { width: 24px; height: 24px; border-radius: 999px; display: inline-grid; place-items: center; font-size: 10px; font-weight: 750; color: #fff;
      margin-left: -6px; border: 2px solid var(--m-card, var(--bg-card)); flex: none; letter-spacing: 0; text-transform: uppercase; }
    .av.sm { width: 18px; height: 18px; font-size: 8.5px; margin-left: 0; border-width: 0; }
    .source { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--m-gbr, var(--border-primary));
      background: transparent; color: var(--m-muted, var(--text-muted)); font-size: 11.5px; font-weight: 600; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .source:hover { color: var(--m-ink, var(--text-primary)); background: var(--bg-hover); }
    [data-form-factor="phone"] .source { padding: 6px 10px; font-size: 13px; }
    .votes .decidebtn { margin-left: auto; }
    .ofoot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .ofoot .spacer { flex: 1 1 auto; }

    /* Comparison table ---------------------------------------------------------- */
    .cmpwrap { overflow-x: auto; border-radius: 16px; border: 1px solid var(--m-cbr, var(--border-primary)); background: var(--m-card, var(--bg-card)); }
    table.cmp { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
    .cmp th, .cmp td { padding: 10px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--m-rowbr, var(--border-faint)); min-width: 150px; }
    .cmp tr:last-child td, .cmp tr:last-child th { border-bottom: 0; }
    .cmp thead th { position: sticky; top: 0; background: var(--m-card, var(--bg-card)); z-index: 1; font-size: 14px; }
    .cmp th.lbl { position: sticky; left: 0; z-index: 2; background: var(--m-card, var(--bg-card)); min-width: 120px; max-width: 160px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--m-faint, var(--text-faint)); }
    .cmp td.best { background: color-mix(in srgb, var(--success) 10%, transparent); font-weight: 700; }
    .cmp .colhead { display: flex; align-items: flex-start; gap: 8px; }
    .cmp .colhead .rank { min-width: 24px; height: 24px; font-size: 11px; }
    .cmp td.vetoed, .cmp th.vetoed { background: color-mix(in srgb, var(--danger) 5%, transparent); }

    /* Archived ---------------------------------------------------------------- */
    .arch { margin-top: 22px; }
    .archrow { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }

    /* Modal --------------------------------------------------------------------- */
    .backdrop { position: fixed; inset: 0; background: var(--overlay, rgba(15, 15, 20, .45)); z-index: 50; display: grid; place-items: center; padding: 20px; }
    .modal { background: var(--m-card, var(--bg-card)) !important; -webkit-backdrop-filter: none; backdrop-filter: none; opacity: 1;
      border: 1px solid var(--m-cbr, var(--border-primary)); border-radius: 18px; box-shadow: var(--shadow-lg, 0 20px 50px rgba(0,0,0,.3));
      width: min(600px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .modal header { display: flex; align-items: flex-start; gap: 10px; }
    .modal header h3 { font-size: 18px; }
    .modal .actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; position: sticky; bottom: -20px; padding: 12px 0 0; background: inherit; }
    @media (max-width: 639px) {
      .backdrop { place-items: end stretch; padding: 0; }
      .modal { width: 100%; max-height: 92vh; border-radius: 18px 18px 0 0 !important; padding: 18px 16px calc(16px + env(safe-area-inset-bottom)); }
    }
    .form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 12px; }
    .form .full { grid-column: 1 / -1; }
    [data-form-factor="phone"] .form { grid-template-columns: 1fr; }
    .form label.f { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .form .lbl { font-size: 12px; font-weight: 600; color: var(--m-muted, var(--text-secondary)); }
    .form .hint { font-size: 11.5px; color: var(--m-faint, var(--text-faint)); }
    .form .err { font-size: 12px; color: var(--danger); }
    .form .trek-input, .form .trek-textarea, .form .trek-select { width: 100%; box-sizing: border-box; }
    .form .pair { display: flex; gap: 8px; }
    .form .pair > * { flex: 1 1 0; min-width: 0; }
    .form .pair > .cur { flex: 0 0 92px; }
    .formsec { grid-column: 1 / -1; margin-top: 4px; display: flex; align-items: center; gap: 8px; }
    .formsec::after { content: ''; flex: 1; border-top: 1px solid var(--m-rowbr, var(--border-faint)); }
    .opts { display: flex; flex-direction: column; gap: 4px; }
    .opt { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; cursor: pointer; }
    .opt:hover { background: var(--bg-hover); }
    .opt input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
    .opt .t { font-weight: 600; font-size: 14px; }
    .opt .d { font-size: 12.5px; color: var(--m-muted, var(--text-muted)); margin-top: 1px; }
    .opt.dis { opacity: .55; cursor: not-allowed; }
    .opt.dis:hover { background: none; }
    .summary { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: var(--bg-hover); }
    .resultlist { display: flex; flex-direction: column; gap: 8px; }
    .result { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
    .result .ic { font-size: 17px; flex: none; margin-top: 1px; }
    .result.ok .ic { color: var(--success); } .result.bad .ic { color: var(--danger); } .result.warn .ic { color: var(--warning, #d97706); }
    .skel { height: 72px; border-radius: 14px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <script>
  (function () {
    'use strict';

    function parseCoords(s) {
      if (!s) return null;
      s = String(s).trim();
      var pats = [
        /^(-?\d{1,2}(?:\.\d+)?)\s*[,;\s]\s*(-?\d{1,3}(?:\.\d+)?)$/,
        /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,
        /@(-?\d+\.\d+),(-?\d+\.\d+)/,
        /[?&](?:q|ll|query|center|sll|daddr)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i,
        /[?&]mlat=(-?\d+\.\d+)&mlon=(-?\d+\.\d+)/,
        /#map=\d+\/(-?\d+\.\d+)\/(-?\d+\.\d+)/
      ];
      for (var i = 0; i < pats.length; i++) {
        var m = s.match(pats[i]);
        if (m) {
          var lat = Number(m[1]), lng = Number(m[2]);
          if (isFinite(lat) && isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180) return { lat: lat, lng: lng };
        }
      }
      return null;
    }
    /**
     * What a booking link reveals by itself: stay dates in the query (Airbnb check_in,
     * Booking.com checkin, Vrbo arrival, …), a hotel name in the Booking.com path, map
     * coordinates. Pure string work — the page is never requested.
     */
    function parseLink(raw, category) {
      var out = { title: null, details: {}, coords: parseCoords(raw) };
      var u;
      try { u = new URL(raw); } catch (e) { return out; }
      if (u.protocol !== 'http:' && u.protocol !== 'https:') return out;
      var q = u.searchParams;
      function first(names) {
        for (var i = 0; i < names.length; i++) {
          var v = q.get(names[i]);
          if (v && /^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
          if (v && /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(v)) { var p = v.split('/'); return p[2] + '-' + p[0].padStart(2, '0') + '-' + p[1].padStart(2, '0'); } // US m/d/Y
        }
        return null;
      }
      var inD = first(['check_in', 'checkin', 'checkIn', 'chkin', 'arrival', 'arrival_date', 'startDate', 'start_date', 'from_date']);
      var outD = first(['check_out', 'checkout', 'checkOut', 'chkout', 'departure', 'departure_date', 'endDate', 'end_date', 'to_date']);
      if (!inD && q.get('checkin_year') && q.get('checkin_month') && q.get('checkin_monthday')) {
        inD = q.get('checkin_year') + '-' + q.get('checkin_month').padStart(2, '0') + '-' + q.get('checkin_monthday').padStart(2, '0');
      }
      if (!outD && q.get('checkout_year') && q.get('checkout_month') && q.get('checkout_monthday')) {
        outD = q.get('checkout_year') + '-' + q.get('checkout_month').padStart(2, '0') + '-' + q.get('checkout_monthday').padStart(2, '0');
      }
      if (category === 'unterkunft') {
        if (inD) out.details.checkin_date = inD;
        if (outD) out.details.checkout_date = outD;
      } else if (category === 'mietwagen') {
        if (inD) out.details.pickup_date = inD;
        if (outD) out.details.return_date = outD;
      } else if ((category === 'aktivitaet' || category === 'sonstiges') && inD) {
        out.details.date = inD;
      }
      // Booking.com: /hotel/es/triana-loft.de.html → "Triana Loft"
      var host = u.hostname.replace(/^www\./, '');
      var m = u.pathname.match(/\/hotel\/[a-z]{2}\/([a-z0-9-]+?)(?:\.[a-z]{2}(?:-[a-z]{2})?)?\.html?$/i);
      if (/(^|\.)booking\.com$/.test(host) && m) {
        out.title = m[1].split('-').filter(Boolean).map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ');
      }
      return out;
    }

    function parsePrice(s) {

      if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
      else s = s.replace(/,/g, '');
      var n = Number(s);
      return isFinite(n) ? n : NaN;
    }

              if (dr.price_total !== undefined) put(price, String(dr.price_total).replace('.', lang() === 'de' ? ',' : '.'));
              put(cur, dr.currency); put(note, dr.price_note); put(notes, dr.notes);
              Object.keys(dr.details || {}).forEach(function (k) { if (detailInputs[k]) put(detailInputs[k].el, dr.details[k]); });
              aiMsg.textContent = L.aiDone(n);
              if (n) { aiBody.classList.add('hidden'); toggle.setAttribute('aria-expanded', 'false'); toggle.lastChild.textContent = L.aiDone(n); title.focus(); }
            }).catch(function () { busyBtn(aiBtn, false); aiMsg.textContent = L.aiHint; });
          });
          aiBox = h('div', { class: 'aibox' }, toggle, aiBody);
        }
        add(box, [modalHead(o ? L.editOption : L.newOption, h('div', { class: 'catlabel cat cat-' + d.category }, icon(d.category), d.title)), aiBox, curList, form]);
      });
    }

    // Decide dialog ---------------------------------------------------------------------
    function tripDates() {
      var t = S.state.trip;
      if (!t.start_date || !t.end_date) return null;
      return { a: t.start_date.slice(0, 10), b: t.end_date.slice(0, 10) };
    }
    function bookingHint(d, o) {
      var type = TYPE_OF[d.category], det = o.details || {}, BH = L.bookingHint;
      if (type === 'hotel') {
        if (!det.checkin_date || !det.checkout_date) return BH.hotelNoDates;
        var td = tripDates();
        if (!td || det.checkin_date < td.a || det.checkout_date > td.b) return BH.hotelOutside;
        return BH.hotel(fmtDate(det.checkin_date), fmtDate(det.checkout_date));
      }
      if (type === 'flight') return BH.flight(det.dep_airport && det.arr_airport ? det.dep_airport + ' → ' + det.arr_airport : '');
      return BH[type];
    }
    function choice(checkbox, title, desc, disabled, descAttr) {
      var dp = { class: 'd', text: desc };
      if (descAttr) dp[descAttr] = true;
      return h('label', { class: 'opt' + (disabled ? ' dis' : '') }, checkbox, h('div', null, h('div', { class: 't', text: title }), desc ? h('div', dp) : null));
    }

    function openDecide(d, o, gapsOnly) {
      var hasPrice = o.price_total !== null && o.price_total !== undefined && o.price_total > 0;
      var others = activeOptions(d).filter(function (x) { return x.id !== o.id; }).length;
      var bookingDone = !!d.linked_reservation_id, costDone = !!d.linked_cost_id;
      var costBlocked = !hasPrice || S.state.costs_unavailable;
      openModal(function (box) {
        var cbBooking = h('input', { type: 'checkbox', checked: !bookingDone, disabled: bookingDone });
        var cbCost = h('input', { type: 'checkbox', checked: !costDone && !costBlocked, disabled: costDone || costBlocked });
        var cbArchive = h('input', { type: 'checkbox', checked: !gapsOnly && others > 0, disabled: gapsOnly || others === 0 });
        var cbNotify = h('input', { type: 'checkbox', checked: !gapsOnly, disabled: gapsOnly });
        // The cost is linked to the booking whenever one exists or is created with it.
        function costText() {
          if (costDone) return L.alreadyCost;
          if (!hasPrice) return L.noPrice;
          if (S.state.costs_unavailable) return L.costsOff;
          var p = money(o.price_total, o.currency);
          return bookingDone || cbBooking.checked ? L.costHint(p) : L.costStandalone(p);
        }
        var costDesc = costText();
        cbBooking.addEventListener('change', function () { var el = box.querySelector('[data-cost-desc]'); if (el) el.textContent = costText(); });
        // Who shares the cost — everyone by default, toggled per member.
        var split = {};
        S.state.members.forEach(function (m) { split[m.id] = true; });
        var splitBox = h('div', { class: 'split' });
        var splitHint = h('div', { class: 'small muted', style: 'margin:0 0 4px 42px' });
        function drawSplit() {
          var ids = S.state.members.filter(function (m) { return split[m.id]; });
          splitBox.replaceChildren.apply(splitBox, S.state.members.map(function (m) {
            return h('button', { type: 'button', 'aria-pressed': String(!!split[m.id]), onClick: function () { split[m.id] = !split[m.id]; drawSplit(); } },
              avatar(m.id), m.name || '?');
          }));
          var c = comparable(o);
          splitHint.textContent = L.splitHint(ids.length, c && ids.length ? money(Math.round(c.amount / ids.length * 100) / 100, c.cur) : '');
          var show = cbCost.checked && !cbCost.disabled;
          splitBox.classList.toggle('hidden', !show);
          splitHint.classList.toggle('hidden', !show);
        }
        cbCost.addEventListener('change', drawSplit);
        drawSplit();
        var go = h('button', { class: 'trek-btn trek-btn--primary' }, icon('check'), gapsOnly ? L.save : L.decide);
        go.addEventListener('click', function () {
          busyBtn(go, true);
          act('/decide', {
            decisionId: d.id, optionId: o.id, locale: lang(),
            booking: cbBooking.checked && !cbBooking.disabled, cost: cbCost.checked && !cbCost.disabled,
            splitMemberIds: S.state.members.filter(function (m) { return split[m.id]; }).map(function (m) { return m.id; }),
            archiveOthers: cbArchive.checked && !cbArchive.disabled, notify: cbNotify.checked && !cbNotify.disabled
          }).then(function (res) { closeModal(); showResults(res && res.results); }).catch(function () { busyBtn(go, false); });
        });
        var pp = perPerson(o);
        add(box, [
          modalHead(gapsOnly ? L.gapsTitle : L.decideTitle(o.title), h('div', { class: 'catlabel cat cat-' + d.category }, icon(d.category), d.title)),
          h('div', { class: 'summary' }, catIcon(d.category), h('div', { class: 'grow' }, h('strong', { text: o.title }),
            o.price_total !== null ? h('div', { class: 'muted small num', text: money(o.price_total, o.currency) + (isForeign(o) && o.price_trip !== null ? ' (' + L.inTripCur(money(o.price_trip, tripCur())) + ')' : '') + (pp ? ' · ' + money(pp.amount, pp.cur) + ' ' + L.perPerson : '') }) : null),
            h('span', { class: 'row small muted' }, icon('up'), String(o.up.length))),
          h('div', { class: 'opts' },
            choice(cbBooking, L.mkBooking, bookingDone ? L.alreadyBooked : bookingHint(d, o), bookingDone),
            choice(cbCost, L.mkCost, costDesc, cbCost.disabled, 'data-cost-desc'),
            splitBox, splitHint,
            gapsOnly ? null : choice(cbArchive, L.archiveOthers(others), null, others === 0),
            gapsOnly ? null : choice(cbNotify, L.notifyGroup, L.notifyHint, false)),
          h('div', { class: 'small faint', text: L.rightsHint }),
          h('div', { class: 'actions' }, h('button', { class: 'trek-btn trek-btn--secondary', onClick: closeModal }, L.cancel), go)
        ]);
      });
    }

    function showResults(r) {
      if (!r) return;
      var lines = [], failed = false;
      function line(kind, text) { lines.push(h('div', { class: 'result ' + kind }, h('span', { class: 'ic' }, icon(kind === 'ok' ? 'done' : kind === 'warn' ? 'hourglass' : 'x')), h('span', { text: text }))); }
      if (r.booking) {
        if (r.booking.ok) { line('ok', L.rBookingOk); (r.booking.warnings || []).forEach(function (w) { line('warn', L.warn[w] || w); }); }
        else { failed = true; line('bad', L.rBooking + ': ' + (L.reason[r.booking.reason] || L.reason.error)); }
      }
      if (r.cost) {
        if (r.cost.ok) line('ok', L.rCostOk);
        else { failed = failed || r.cost.reason !== 'no_price'; line('bad', L.rCost + ': ' + (L.reason[r.cost.reason] || L.reason.error)); }
      }
      if (r.archived && r.archived.count) line('ok', L.rArchived(r.archived.count));
      if (r.notified) { if (r.notified.ok) line('ok', L.rNotified); else { failed = true; line('bad', L.rNotify + ': ' + (L.reason[r.notified.reason] || L.reason.error)); } }
      var warned = r.booking && r.booking.ok && r.booking.warnings && r.booking.warnings.length;
      if (!failed && !warned) { trek.notify('success', L.decidedToast); return; }
      openModal(function (box) {
        add(box, [modalHead(failed ? L.resultTitle : L.decidedToast), h('div', { class: 'resultlist' }, lines),
          h('div', { class: 'actions' }, h('button', { class: 'trek-btn trek-btn--primary', onClick: closeModal }, 'OK'))]);
      });
    }

    // -------------------------------------------------------------------------
    // Boot
    // -------------------------------------------------------------------------
    var booted = false;
    render(); // loading skeleton until the context arrives
    trek.onContext(function (ctx) {
      var prevTrip = S.ctx && S.ctx.tripId;
      S.ctx = ctx;
      if (!booted) {
        booted = true;
        // Restore the last view of this trip (per browser tab), but never wait on it
        // for longer than a moment.
        var restore = new Promise(function (resolve) {
          setTimeout(resolve, 400);
          try {
            trek.session.get('view', { scope: 'trip' }).then(function (v) {
              if (v && v.v === 'detail' && v.d) { S.view = 'detail'; S.decisionId = v.d; }
              if (v && (v.m === 'cards' || v.m === 'table')) S.mode = v.m;
            }).catch(function () {}).then(resolve);
          } catch (e) { resolve(); }
        });
        restore.then(function () { render(); load(); });
        return;
      }
      if (String(prevTrip) !== String(ctx.tripId)) { S.state = null; S.loading = true; S.view = 'list'; load(); }
      render();
    });

    trek.onEvent(function (event, tid) {
      if (!S.ctx || String(tid) !== String(S.ctx.tripId)) return;
      if (/^plugin:entscheidungen:/.test(event) || /^(reservation|budget|accommodation):/.test(event)) scheduleReload();
    });

    // Keep countdowns fresh without a reload.
    setInterval(function () { if (S.state && !modalClose && !(document.activeElement && document.activeElement.tagName === 'INPUT')) render(); }, 60000);
  })();
  </script>
</body>
</html>
