name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # node:sqlite (tests + dev server) needs Node 22.5+
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx trek-plugin validate
      - run: npx trek-plugin pack
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: plugin.zip
          retention-days: 14
